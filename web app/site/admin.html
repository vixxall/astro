<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Panel - Astro Hub</title>
  <meta name="description" content="Astro Hub admin dashboard for users, favorites and quiz leaderboard activity." />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="galaxy-bg"></div>
  <div class="stars"></div>
  <div id="navbar"></div>

  <section class="page-header container">
    <span class="chip mb-3"><i class="fa-solid fa-user-shield me-2"></i>Admin Panel</span>
    <h1 class="fw-bold display-5">Astro Hub <span class="gradient-text">Control Center</span></h1>
    <p class="section-subtitle mt-2">Monitor users, saved favorites and quiz leaderboard activity.</p>
  </section>

  <main class="container pb-5">
    <div id="adminAuthNotice" class="space-card p-4 text-center text-muted-space d-none"></div>

    <div id="adminPanel" class="d-none">
      <div class="row g-4 mb-4" id="adminStatsGrid"></div>

      <div class="row g-4">
        <div class="col-xl-8">
          <div class="space-card p-4 admin-table-card">
            <div class="d-flex align-items-center justify-content-between gap-3 mb-3">
              <h4 class="fw-bold mb-0"><i class="fa-solid fa-users text-info me-2"></i>Users</h4>
              <span class="text-muted-space small">All registered accounts</span>
            </div>
            <div class="table-responsive">
              <table class="table table-dark table-hover align-middle admin-table mb-0">
                <thead>
                  <tr>
                    <th>Name</th>
                    <th>Email</th>
                    <th>Role</th>
                    <th>Favorites</th>
                    <th>Joined</th>
                  </tr>
                </thead>
                <tbody id="adminUsersBody"></tbody>
              </table>
            </div>
          </div>
        </div>

        <div class="col-xl-4">
          <div class="space-card p-4 admin-table-card h-100">
            <h4 class="fw-bold mb-3"><i class="fa-solid fa-clock text-info me-2"></i>Recent Users</h4>
            <div class="table-responsive">
              <table class="table table-dark table-hover align-middle admin-table mb-0">
                <thead>
                  <tr>
                    <th>Name</th>
                    <th>Email</th>
                    <th>Joined</th>
                  </tr>
                </thead>
                <tbody id="adminRecentUsersBody"></tbody>
              </table>
            </div>
          </div>
        </div>

        <div class="col-12">
          <div class="space-card p-4 admin-table-card">
            <div class="d-flex align-items-center justify-content-between gap-3 mb-3">
              <h4 class="fw-bold mb-0"><i class="fa-solid fa-trophy text-info me-2"></i>Leaderboard</h4>
              <span class="text-muted-space small">Top 25 quiz submissions</span>
            </div>
            <div class="table-responsive">
              <table class="table table-dark table-hover align-middle admin-table mb-0">
                <thead>
                  <tr>
                    <th>Rank</th>
                    <th>Callsign</th>
                    <th>Score</th>
                    <th>Topic</th>
                    <th>User</th>
                    <th>Submitted</th>
                  </tr>
                </thead>
                <tbody id="adminLeaderboardBody"></tbody>
              </table>
            </div>
          </div>
        </div>
      </div>
    </div>
  </main>

  <div id="footer"></div>

  <script>window.ACTIVE_PAGE = "admin.html";</script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="data.js"></script>
  <script src="script.js"></script>
</body>
</html>
