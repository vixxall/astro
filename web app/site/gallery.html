<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NASA Gallery - Astro Hub</title>
  <meta name="description" content="Browse a stunning gallery of space imagery: galaxies, nebulae, planets, astronauts and more." />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="galaxy-bg"></div>
  <div class="stars"></div>
  <div id="navbar"></div>

  <section class="page-header container">
    <span class="chip mb-3">📸 NASA Gallery</span>
    <h1 class="fw-bold display-5">Cosmic <span class="gradient-text">Image Gallery</span></h1>
    <p class="section-subtitle mt-2">Search and filter through breathtaking images from across the universe.</p>
  </section>

  <!-- Search + category filter -->
  <section class="container">
    <div class="row g-3 justify-content-center mb-5">
      <div class="col-md-6">
        <div class="input-group">
          <span class="input-group-text bg-panel border-0"><i class="fa-solid fa-magnifying-glass text-info"></i></span>
          <input type="text" id="searchInput" class="form-control" placeholder="Search images..." aria-label="Search images" />
        </div>
      </div>
      <div class="col-md-4">
        <select id="categoryFilter" class="form-select" aria-label="Filter by category">
          <option value="all">All Categories</option>
        </select>
      </div>
    </div>
  </section>

  <!-- Gallery grid (filled by script.js) -->
  <section class="container pb-5">
    <div class="row g-4" id="galleryGrid"></div>
  </section>

  <!-- Image popup modal -->
  <div class="modal fade" id="imageModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered modal-lg">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title fw-bold" id="imageModalTitle">Image</h5>
          <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body text-center">
          <img id="imageModalImg" src="" alt="" class="img-fluid rounded-4 mb-3" />
          <p class="text-muted-space" id="imageModalDesc"></p>
        </div>
        <div class="modal-footer border-0">
          <button class="btn btn-space" onclick="fakeDownload()">
            <i class="fa-solid fa-download me-1"></i>Download
          </button>
        </div>
      </div>
    </div>
  </div>

  <div id="footer"></div>

  <script>window.ACTIVE_PAGE = "gallery.html";</script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="data.js"></script>
  <script src="script.js"></script>
</body>
</html>
