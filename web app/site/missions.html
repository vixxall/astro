<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Space Missions - Astro Hub</title>
  <meta name="description" content="Explore legendary NASA and ISRO space missions from Apollo 11 to Chandrayaan-3." />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="galaxy-bg"></div>
  <div class="stars"></div>
  <div id="navbar"></div>

  <section class="page-header container">
    <span class="chip mb-3">🚀 Space Missions</span>
    <h1 class="fw-bold display-5">Legendary <span class="gradient-text">Space Missions</span></h1>
    <p class="section-subtitle mt-2">From the first steps on the Moon to the edge of the Solar System — explore missions by NASA, ISRO, ESA and more.</p>
  </section>

  <section class="container pb-5">
    <div class="row g-4" id="missionGrid"></div>
  </section>

  <!-- Mission detail modal (dark themed) -->
  <div class="modal fade" id="missionModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered modal-lg">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title fw-bold" id="missionModalTitle">Mission</h5>
          <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body" id="missionModalBody"></div>
      </div>
    </div>
  </div>

  <div id="footer"></div>

  <script>window.ACTIVE_PAGE = "missions.html";</script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="data.js"></script>
  <script src="script.js"></script>
</body>
</html>
